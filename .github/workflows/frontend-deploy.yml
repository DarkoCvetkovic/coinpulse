name: Frontend Deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Add SPA fallback
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Checkout Pages branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: .pages

      - name: Publish frontend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rsync -a --delete --exclude '.git/' --exclude 'reports/' frontend/dist/ .pages/
          touch .pages/.nojekyll
          cd .pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Frontend is already current'
            exit 0
          fi
          git commit -m 'Deploy frontend'
          git push origin gh-pages
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
