name: Daily tests

on:
  schedule:
    # 06:00 UTC = 08:00 CEST (07:00 CET in winter), Monday to Friday
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-tests
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 14

  frontend-unit:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  cypress:
    name: Cypress E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CYPRESS_STANDARD_USERNAME: ${{ secrets.STANDARD_USERNAME }}
      CYPRESS_STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
      CYPRESS_LOCKED_USERNAME: ${{ secrets.LOCKED_USERNAME }}
      CYPRESS_LOCKED_PASSWORD: ${{ secrets.LOCKED_PASSWORD }}
      CYPRESS_ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      CYPRESS_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Boot the app
        uses: ./.github/actions/boot-app

      - name: Set up Node for the suite
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests-cypress/package-lock.json

      - name: Install dependencies
        working-directory: tests-cypress
        run: npm ci

      - name: Smoke suite (fast gate)
        working-directory: tests-cypress
        run: npm run test:smoke

      - name: Full suite
        working-directory: tests-cypress
        run: npm run cy:run

      - name: Upload Mochawesome report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cypress-report
          path: tests-cypress/cypress/reports/
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: cypress-screenshots
          path: tests-cypress/cypress/screenshots/
          retention-days: 14

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STANDARD_USERNAME: ${{ secrets.STANDARD_USERNAME }}
      STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
      LOCKED_USERNAME: ${{ secrets.LOCKED_USERNAME }}
      LOCKED_PASSWORD: ${{ secrets.LOCKED_PASSWORD }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      PUBLIC_REPORT: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Boot the app
        uses: ./.github/actions/boot-app

      - name: Set up Node for the suite
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests-playwright/package-lock.json

      - name: Install dependencies
        working-directory: tests-playwright
        run: npm ci

      - name: Install browsers
        working-directory: tests-playwright
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Smoke suite (fast gate)
        working-directory: tests-playwright
        run: npm run test:smoke

      - name: Full suite (three browsers)
        working-directory: tests-playwright
        run: npm test

      - name: Protect public HTML report
        id: protect_report
        if: always()
        run: python3 .github/scripts/protect-public-reports.py sanitize-playwright tests-playwright/playwright-report/index.html

      - name: Upload HTML report
        if: steps.protect_report.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: tests-playwright/playwright-report/
          retention-days: 14

  selenium:
    name: Selenium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COINPULSE_BROWSER: chrome
      STANDARD_USERNAME: ${{ secrets.STANDARD_USERNAME }}
      STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
      LOCKED_USERNAME: ${{ secrets.LOCKED_USERNAME }}
      LOCKED_PASSWORD: ${{ secrets.LOCKED_PASSWORD }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Boot the app
        uses: ./.github/actions/boot-app

      - name: Smoke suite (fast gate)
        working-directory: tests-selenium
        run: ./mvnw -B -ntp test -Dtest='*SmokeTest'

      - name: Reset Allure results
        working-directory: tests-selenium
        run: rm -rf target/allure-results

      - name: Full suite
        working-directory: tests-selenium
        run: ./mvnw -B -ntp test

      - name: Generate Allure report
        if: always()
        working-directory: tests-selenium
        run: ./mvnw -B -ntp allure:report -DskipTests

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: selenium-allure-report
          path: tests-selenium/target/site/allure-maven-plugin/
          retention-days: 14

  jmeter:
    name: JMeter baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Boot the app
        uses: ./.github/actions/boot-app
        with:
          frontend: "false"

      - name: Write user properties
        working-directory: tests-jmeter
        env:
          STANDARD_USERNAME: ${{ secrets.STANDARD_USERNAME }}
          STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
        run: |
          printf 'coinpulse.standard.username=%s\ncoinpulse.standard.password=%s\n' \
            "$STANDARD_USERNAME" "$STANDARD_PASSWORD" > user.properties

      - name: Run the baseline scenario
        working-directory: tests-jmeter
        run: ./mvnw -B -ntp clean verify

      - name: Upload HTML dashboard
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jmeter-dashboard
          path: tests-jmeter/target/jmeter/reports/coinpulse-api/
          retention-days: 14

  publish-reports:
    name: Publish live reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [cypress, playwright, selenium, jmeter]
    if: always()
    permissions:
      contents: write
      pages: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout Pages branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: .pages

      - name: Download Cypress report
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: cypress-report
          path: .reports/cypress

      - name: Download Playwright report
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: playwright-report
          path: .reports/playwright

      - name: Download Selenium report
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: selenium-allure-report
          path: .reports/selenium

      - name: Download JMeter dashboard
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: jmeter-dashboard
          path: .reports/jmeter

      - name: Check reports for passwords
        env:
          STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
          LOCKED_PASSWORD: ${{ secrets.LOCKED_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: python3 .github/scripts/protect-public-reports.py check .reports

      - name: Publish reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .pages/reports
          cp .github/pages/reports/index.html .pages/reports/index.html
          for suite in cypress playwright selenium jmeter; do
            if [ -f ".reports/$suite/index.html" ]; then
              rm -rf ".pages/reports/$suite"
              cp -a ".reports/$suite" ".pages/reports/$suite"
            else
              echo "No new $suite report, keeping the published version"
            fi
          done
          touch .pages/.nojekyll
          cd .pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Reports are already current'
            exit 0
          fi
          git commit -m 'Publish test reports'
          git push origin gh-pages
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

  notify:
    name: Email report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      [
        backend-unit,
        frontend-unit,
        cypress,
        playwright,
        selenium,
        jmeter,
        publish-reports,
      ]
    if: always()
    steps:
      - name: Compose the report
        id: report
        env:
          BACKEND_UNIT: ${{ needs.backend-unit.result }}
          FRONTEND_UNIT: ${{ needs.frontend-unit.result }}
          CYPRESS: ${{ needs.cypress.result }}
          PLAYWRIGHT: ${{ needs.playwright.result }}
          SELENIUM: ${{ needs.selenium.result }}
          JMETER: ${{ needs.jmeter.result }}
          REPORTS_PUBLISH: ${{ needs.publish-reports.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORTS_URL: https://darkocvetkovic.github.io/coinpulse/reports/
        run: |
          label() {
            case "$1" in
              success) echo "PASS" ;;
              failure) echo "FAIL" ;;
              *) echo "$(echo "$1" | tr '[:lower:]' '[:upper:]')" ;;
            esac
          }
          overall=PASSED
          passed=0
          for r in "$BACKEND_UNIT" "$FRONTEND_UNIT" "$CYPRESS" "$PLAYWRIGHT" "$SELENIUM" "$JMETER"; do
            if [ "$r" = "success" ]; then passed=$((passed + 1)); else overall=FAILED; fi
          done
          if [ "$REPORTS_PUBLISH" != "success" ]; then overall=FAILED; fi
          {
            echo "CoinPulse daily test report - $(date -u +%Y-%m-%d)"
            echo
            echo "Backend unit:    $(label "$BACKEND_UNIT")"
            echo "Frontend unit:   $(label "$FRONTEND_UNIT")"
            echo "Cypress E2E:     $(label "$CYPRESS")"
            echo "Playwright E2E:  $(label "$PLAYWRIGHT")"
            echo "Selenium E2E:    $(label "$SELENIUM")"
            echo "JMeter baseline: $(label "$JMETER")"
            echo "Report publish:  $(label "$REPORTS_PUBLISH")"
            echo
            echo "Live HTML reports:"
            echo "$REPORTS_URL"
            echo
            echo "Run details and downloadable artifacts:"
            echo "$RUN_URL"
          } > body.txt
          echo "subject=CoinPulse daily tests: $overall ($passed/6 suites)" >> "$GITHUB_OUTPUT"

      - name: Send the email
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          from: CoinPulse CI <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.report.outputs.subject }}
          body: file://body.txt
